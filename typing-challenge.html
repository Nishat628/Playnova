<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Challenge — PlayNova Arcade</title>
  <style>
    :root {
      --bg: #0b0914;
      --panel: #151126;
      --panel-2: #1d1734;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f3ff;
      --muted: #a79ec7;
      --accent: #8b5cf6;
      --accent-2: #ec4899;
      --good: #34d399;
      --bad: #f87171;
      --warn: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.22), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(236, 72, 153, 0.16), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.92rem;
      flex: 0 0 auto;
    }

    .brand h1 {
      font-size: 1.1rem;
      line-height: 1.2;
    }

    .brand p {
      font-size: 0.72rem;
      letter-spacing: 1px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .back-btn {
      text-decoration: none;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 4px;
      color: #ffffff;
    }

    .stat-value.good { color: var(--good); }
    .stat-value.warn { color: var(--warn); }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .mode-group {
      display: flex;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.84rem;
      padding: 8px 14px;
      border-radius: 9px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid rgba(168, 85, 247, 0.55);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .prompt-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .prompt-text {
      font-size: 1.08rem;
      line-height: 1.8;
      color: var(--muted);
      background: #100c1e;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      min-height: 92px;
      word-spacing: 2px;
    }

    .ch-ok { color: var(--good); }
    .ch-bad {
      color: var(--bad);
      background: rgba(248, 113, 113, 0.2);
      border-radius: 3px;
    }
    .ch-cur {
      color: #fff;
      background: rgba(139, 92, 246, 0.35);
      border-bottom: 2px solid #c084fc;
      border-radius: 3px;
    }

    .typing-input {
      width: 100%;
      background: #100c1e;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .typing-input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.25);
    }

    .result-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .result-box.show {
      display: flex;
    }

    .result-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--good);
    }

    .result-sub {
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top-bar">
      <div class="brand">
        <div class="badge">TC</div>
        <div>
          <h1>Typing Challenge</h1>
          <p>PlayNova Arcade</p>
        </div>
      </div>
      <a href="index.html" class="back-btn">← Games</a>
    </header>

    <section class="stats-grid">
      <div class="stat">
        <div class="stat-label">WPM</div>
        <div id="wpmEl" class="stat-value good">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Accuracy</div>
        <div id="accEl" class="stat-value">100%</div>
      </div>
      <div class="stat">
        <div class="stat-label">Time Left</div>
        <div id="timeEl" class="stat-value warn">30s</div>
      </div>
      <div class="stat">
        <div class="stat-label">Best WPM</div>
        <div id="bestEl" class="stat-value">0</div>
      </div>
    </section>

    <div class="controls-row">
      <div class="mode-group">
        <button id="mode30" class="mode-btn active" type="button">30s</button>
        <button id="mode60" class="mode-btn" type="button">60s</button>
      </div>
      <button id="restartBtn" class="btn" type="button">↻ Restart</button>
    </div>

    <section class="prompt-card">
      <div id="promptText" class="prompt-text"></div>
      <input
        id="typingInput"
        class="typing-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Type the text shown above..."
      />
    </section>

    <section id="resultBox" class="result-box">
      <div id="resultTitle" class="result-title">Round Complete!</div>
      <div id="resultSub" class="result-sub"></div>
    </section>
  </main>

  <script>
    (function () {
      const BEST_KEY = "playnova_typing_best_wpm_v1";
      const SENTENCES = [
        "Fast fingers and calm focus make every typing round smooth and accurate.",
        "PlayNova brings arcade puzzles, city building, and speed challenges together.",
        "Practice a little every day to type faster without losing accuracy.",
        "Clean design and quick controls make browser games fun on any screen."
      ];

      let duration = 30;
      let timeLeft = 30;
      let timerId = null;
      let started = false;
      let finished = false;
      let targetText = "";
      let bestWpm = 0;

      const wpmEl = document.getElementById("wpmEl");
      const accEl = document.getElementById("accEl");
      const timeEl = document.getElementById("timeEl");
      const bestEl = document.getElementById("bestEl");
      const promptTextEl = document.getElementById("promptText");
      const typingInput = document.getElementById("typingInput");
      const resultBox = document.getElementById("resultBox");
      const resultTitle = document.getElementById("resultTitle");
      const resultSub = document.getElementById("resultSub");
      const mode30Btn = document.getElementById("mode30");
      const mode60Btn = document.getElementById("mode60");
      const restartBtn = document.getElementById("restartBtn");

      function loadBest() {
        try {
          const val = parseInt(localStorage.getItem(BEST_KEY) || "0", 10);
          bestWpm = val > 0 ? val : 0;
        } catch (e) {
          bestWpm = 0;
        }
        bestEl.textContent = String(bestWpm);
      }

      function saveBest(wpm) {
        if (wpm > bestWpm) {
          bestWpm = wpm;
          bestEl.textContent = String(bestWpm);
          try {
            localStorage.setItem(BEST_KEY, String(bestWpm));
          } catch (e) {}
        }
      }

      function getText() {
        const list = SENTENCES.slice().sort(function () {
          return Math.random() - 0.5;
        });
        return list[0] + " " + list[1];
      }

      function renderText(typed) {
        let html = "";
        for (let i = 0; i < targetText.length; i++) {
          const ch = targetText[i];
          const displayCh = ch === " " ? "&nbsp;" : ch;
          let cls = "";
          if (i < typed.length) {
            cls = typed[i] === ch ? "ch-ok" : "ch-bad";
          } else if (i === typed.length && !finished) {
            cls = "ch-cur";
          }
          html += '<span class="' + cls + '">' + displayCh + "</span>";
        }
        promptTextEl.innerHTML = html;
      }

      function calcStats(typed) {
        const elapsed = Math.max(1, duration - timeLeft);
        let correct = 0;
        for (let i = 0; i < typed.length && i < targetText.length; i++) {
          if (typed[i] === targetText[i]) correct++;
        }
        const wpm = Math.max(0, Math.round((correct / 5) / (elapsed / 60)));
        const acc = typed.length > 0 ? Math.max(0, Math.min(100, Math.round((correct / typed.length) * 100))) : 100;
        return { wpm: wpm, acc: acc };
      }

      function refreshStats() {
        const stats = calcStats(typingInput.value);
        wpmEl.textContent = String(stats.wpm);
        accEl.textContent = stats.acc + "%";
        timeEl.textContent = timeLeft + "s";
      }

      function endRound() {
        if (finished) return;
        finished = true;
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        typingInput.disabled = true;
        const stats = calcStats(typingInput.value);
        wpmEl.textContent = String(stats.wpm);
        accEl.textContent = stats.acc + "%";
        saveBest(stats.wpm);
        resultTitle.textContent = stats.wpm >= bestWpm && stats.wpm > 0 ? "New Best Speed!" : "Round Complete!";
        resultSub.textContent = "Speed: " + stats.wpm + " WPM • Accuracy: " + stats.acc + "% • Best: " + bestWpm + " WPM";
        resultBox.classList.add("show");
        renderText(typingInput.value);
      }

      function beginTimer() {
        if (started || finished) return;
        started = true;
        timerId = setInterval(function () {
          timeLeft -= 1;
          if (timeLeft <= 0) {
            timeLeft = 0;
            refreshStats();
            endRound();
          } else {
            refreshStats();
          }
        }, 1000);
      }

      function resetGame(newDur) {
        duration = newDur;
        timeLeft = duration;
        started = false;
        finished = false;
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        targetText = getText();
        typingInput.disabled = false;
        typingInput.value = "";
        resultBox.classList.remove("show");
        mode30Btn.classList.toggle("active", duration === 30);
        mode60Btn.classList.toggle("active", duration === 60);
        renderText("");
        refreshStats();
      }

      typingInput.addEventListener("input", function () {
        if (finished) return;
        if (!started && typingInput.value.length > 0) {
          beginTimer();
        }
        if (typingInput.value.length >= targetText.length) {
          endRound();
          return;
        }
        renderText(typingInput.value);
        refreshStats();
      });

      mode30Btn.addEventListener("click", function () {
        resetGame(30);
      });

      mode60Btn.addEventListener("click", function () {
        resetGame(60);
      });

      restartBtn.addEventListener("click", function () {
        resetGame(duration);
      });

      loadBest();
      resetGame(30);
    })();
  </script>
</body>
</html>
