<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0914" />
  <title>NOVA MATCH 3 | PlayNova</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --bg-main: #0b0914;
      --bg-card: #161229;
      --bg-board: #120e22;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.09);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e143d 0%, var(--bg-main) 65%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.4px;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .back-btn {
      text-decoration: none;
      color: var(--text-main);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .back-btn:active {
      transform: scale(0.96);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.14s ease, opacity 0.14s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #fff;
      box-shadow: 0 6px 18px var(--accent-glow);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .board-wrap {
      position: relative;
      background: var(--bg-board);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      touch-action: none;
    }

    .tile {
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: clamp(20px, 5.2vw, 28px);
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.2s ease;
      position: relative;
    }

    .tile.selected {
      transform: scale(1.08);
      border-color: #ffffff;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.55);
      z-index: 2;
    }

    .tile.matched {
      transform: scale(0.2);
      opacity: 0;
    }

    /* 6 Distinct Gem Themes */
    .gem-0 { background: linear-gradient(145deg, #ef4444, #991b1b); }
    .gem-1 { background: linear-gradient(145deg, #3b82f6, #1d4ed8); }
    .gem-2 { background: linear-gradient(145deg, #10b981, #047857); }
    .gem-3 { background: linear-gradient(145deg, #f59e0b, #b45309); }
    .gem-4 { background: linear-gradient(145deg, #a855f7, #6b21a8); }
    .gem-5 { background: linear-gradient(145deg, #ec4899, #9d174d); }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 9, 20, 0.88);
      backdrop-filter: blur(4px);
      border-radius: 18px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      gap: 12px;
      z-index: 10;
    }

    .overlay.show {
      display: flex;
    }

    .overlay h2 {
      margin: 0;
      font-size: 26px;
    }

    .overlay p {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .help {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <div class="brand">
        <div class="brand-badge">M3</div>
        <div>
          <div class="brand-title">Nova Match 3</div>
          <div class="brand-sub">PlayNova Arcade</div>
        </div>
      </div>
      <a class="back-btn" href="index.html">← Games</a>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Best</div>
        <div class="stat-value" id="best">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Moves</div>
        <div class="stat-value" id="moves">25</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="newGameBtn">+ New Game</button>
      <button class="btn btn-secondary" id="shuffleBtn">Shuffle</button>
    </div>

    <div class="board-wrap">
      <div class="grid" id="grid"></div>
      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">Out of Moves!</h2>
        <p id="overlayText">Final Score: 0</p>
        <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
      </div>
    </div>

    <div class="help">
      Tap two adjacent blocks to swap, or swipe across a block in any direction.<br />
      Match 3 or more identical blocks in a row or column to score!
    </div>
  </div>

  <script>
    const SIZE = 7;
    const START_MOVES = 25;
    const GEMS = ["🍎", "💎", "🍀", "🌟", "🔮", "🍓"];
    const BEST_KEY = "playnova_match3_best_v1";

    const gridEl = document.getElementById("grid");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const movesEl = document.getElementById("moves");
    const overlayEl = document.getElementById("overlay");
    const overlayTitleEl = document.getElementById("overlayTitle");
    const overlayTextEl = document.getElementById("overlayText");

    let board = [];
    let selected = null;
    let score = 0;
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    let moves = START_MOVES;
    let locked = false;
    let touchStart = null;

    bestEl.textContent = best;

    function randomGem() {
      return Math.floor(Math.random() * GEMS.length);
    }

    function createsMatchAt(r, c, val) {
      if (c >= 2 && board[r][c - 1] === val && board[r][c - 2] === val) return true;
      if (r >= 2 && board[r - 1][c] === val && board[r - 2][c] === val) return true;
      return false;
    }

    function initBoard() {
      board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          let gem;
          let safety = 0;
          do {
            gem = randomGem();
            safety++;
          } while (createsMatchAt(r, c, gem) && safety < 50);
          board[r][c] = gem;
        }
      }
      if (!hasPossibleMove()) {
        shuffleBoard(true);
      }
    }

    function updateHud() {
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, String(best));
      }
      bestEl.textContent = best;
      movesEl.textContent = moves;
    }

    function renderBoard(matchedSet = new Set()) {
      gridEl.innerHTML = "";
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const val = board[r][c];
          const tile = document.createElement("div");
          tile.className = `tile gem-${val}`;
          tile.dataset.r = r;
          tile.dataset.c = c;
          tile.textContent = GEMS[val];

          if (selected && selected.r === r && selected.c === c) {
            tile.classList.add("selected");
          }
          if (matchedSet.has(`${r},${c}`)) {
            tile.classList.add("matched");
          }

          tile.addEventListener("click", () => onTileClick(r, c));
          tile.addEventListener("pointerdown", (e) => {
            touchStart = { r, c, x: e.clientX, y: e.clientY };
          });
          tile.addEventListener("pointerup", (e) => {
            if (!touchStart || locked) return;
            const dx = e.clientX - touchStart.x;
            const dy = e.clientY - touchStart.y;
            const absX = Math.abs(dx);
            const absY = Math.abs(dy);
            const startR = touchStart.r;
            const startC = touchStart.c;
            touchStart = null;

            if (Math.max(absX, absY) > 22) {
              let targetR = startR;
              let targetC = startC;
              if (absX > absY) {
                targetC += dx > 0 ? 1 : -1;
              } else {
                targetR += dy > 0 ? 1 : -1;
              }
              if (targetR >= 0 && targetR < SIZE && targetC >= 0 && targetC < SIZE) {
                selected = null;
                trySwap({ r: startR, c: startC }, { r: targetR, c: targetC });
              }
            }
          });

          gridEl.appendChild(tile);
        }
      }
    }

    function isAdjacent(a, b) {
      return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
    }

    function swapValues(a, b) {
      const temp = board[a.r][a.c];
      board[a.r][a.c] = board[b.r][b.c];
      board[b.r][b.c] = temp;
    }

    function findMatches() {
      const matched = new Set();

      // Horizontal runs
      for (let r = 0; r < SIZE; r++) {
        let count = 1;
        for (let c = 1; c <= SIZE; c++) {
          if (c < SIZE && board[r][c] === board[r][c - 1]) {
            count++;
          } else {
            if (count >= 3) {
              for (let k = c - count; k < c; k++) matched.add(`${r},${k}`);
            }
            count = 1;
          }
        }
      }

      // Vertical runs
      for (let c = 0; c < SIZE; c++) {
        let count = 1;
        for (let r = 1; r <= SIZE; r++) {
          if (r < SIZE && board[r][c] === board[r - 1][c]) {
            count++;
          } else {
            if (count >= 3) {
              for (let k = r - count; k < r; k++) matched.add(`${k},${c}`);
            }
            count = 1;
          }
        }
      }

      return matched;
    }

    function hasPossibleMove() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (c + 1 < SIZE) {
            swapValues({ r, c }, { r, c: c + 1 });
            const ok = findMatches().size > 0;
            swapValues({ r, c }, { r, c: c + 1 });
            if (ok) return true;
          }
          if (r + 1 < SIZE) {
            swapValues({ r, c }, { r: r + 1, c });
            const ok = findMatches().size > 0;
            swapValues({ r, c }, { r: r + 1, c });
            if (ok) return true;
          }
        }
      }
      return false;
    }

    function shuffleBoard(silent = false) {
      if (locked && !silent) return;
      const flat = board.flat();
      for (let i = flat.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flat[i], flat[j]] = [flat[j], flat[i]];
      }
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          board[r][c] = flat[r * SIZE + c];
        }
      }
      if (findMatches().size > 0 || !hasPossibleMove()) {
        initBoard();
      }
      selected = null;
      if (!silent) renderBoard();
    }

    function collapseAndRefill(matchedSet) {
      for (let c = 0; c < SIZE; c++) {
        const column = [];
        for (let r = SIZE - 1; r >= 0; r--) {
          if (!matchedSet.has(`${r},${c}`)) {
            column.push(board[r][c]);
          }
        }
        while (column.length < SIZE) {
          column.push(randomGem());
        }
        for (let r = SIZE - 1, idx = 0; r >= 0; r--, idx++) {
          board[r][c] = column[idx];
        }
      }
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function resolveMatches(combo = 1) {
      let matches = findMatches();
      while (matches.size > 0) {
        score += matches.size * 15 * combo;
        updateHud();
        renderBoard(matches);
        await wait(200);
        collapseAndRefill(matches);
        renderBoard();
        await wait(160);
        combo++;
        matches = findMatches();
      }

      if (!hasPossibleMove() && moves > 0) {
        shuffleBoard(true);
        renderBoard();
      }

      if (moves <= 0) {
        overlayTitleEl.textContent = "Out of Moves!";
        overlayTextEl.textContent = `Final Score: ${score} (Best: ${best})`;
        overlayEl.classList.add("show");
      }
    }

    async function trySwap(a, b) {
      locked = true;
      swapValues(a, b);
      const matches = findMatches();

      if (matches.size === 0) {
        renderBoard();
        await wait(160);
        swapValues(a, b);
        renderBoard();
        locked = false;
        return;
      }

      moves = Math.max(0, moves - 1);
      updateHud();
      await resolveMatches(1);
      locked = false;
    }

    function onTileClick(r, c) {
      if (locked || moves <= 0) return;
      if (!selected) {
        selected = { r, c };
        renderBoard();
        return;
      }
      if (selected.r === r && selected.c === c) {
        selected = null;
        renderBoard();
        return;
      }
      if (isAdjacent(selected, { r, c })) {
        const first = selected;
        selected = null;
        trySwap(first, { r, c });
      } else {
        selected = { r, c };
        renderBoard();
      }
    }

    function startNewGame() {
      score = 0;
      moves = START_MOVES;
      selected = null;
      locked = false;
      overlayEl.classList.remove("show");
      initBoard();
      updateHud();
      renderBoard();
    }

    document.getElementById("newGameBtn").addEventListener("click", startNewGame);
    document.getElementById("playAgainBtn").addEventListener("click", startNewGame);
    document.getElementById("shuffleBtn").addEventListener("click", () => shuffleBoard(false));

    startNewGame();
  </script>
</body>
</html>
